# Entorno de desarrollo local — NO usar estas credenciales en producción.
#
#   make up        # levanta PostgreSQL, Redis y el almacenamiento S3
#   make migrate   # aplica migraciones y carga el catálogo de controles
#   make dev       # arranca la API contra la base de datos
#
# La API se conecta con el rol sgsi_app (sin privilegios de superusuario) para
# que las políticas RLS se apliquen. El rol sgsi solo se usa para migraciones.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sgsi
      POSTGRES_PASSWORD: sgsi_dev
      POSTGRES_DB: sgsi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgsi -d sgsi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Almacenamiento compatible con S3 para documentos y evidencias.
  # (La imagen minio/minio dejó de publicarse en Docker Hub; SeaweedFS ofrece
  # la misma API S3.) Credenciales de desarrollo en deploy/docker/seaweedfs/s3.json.
  storage:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3data:/data
      - ./deploy/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Perfil opcional: `docker compose --profile app up --build`
  # (compila la API en un contenedor, aplica las migraciones y la arranca)
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgres://sgsi_app:sgsi_app_dev@postgres:5432/sgsi?sslmode=disable
      DATABASE_MIGRATE_URL: postgres://sgsi:sgsi_dev@postgres:5432/sgsi?sslmode=disable
      AUTH_DEV_MODE: "true"
      APP_URL: http://localhost:3000
      S3_ENDPOINT: http://storage:8333
      S3_BUCKET: sgsi-documents
      S3_ACCESS_KEY: sgsi_s3
      S3_SECRET_KEY: sgsi_s3_dev
      CORS_ORIGINS: http://localhost:3000
      LOG_FORMAT: text
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  s3data:
