name: ISO 27001 Compliance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -v ./...

      - name: Build binaries
        run: |
          go build -v -o iso-cli ./cmd/iso-cli/
          go build -v -o /tmp/api ./cmd/api/
          go build -v -o /tmp/migrate ./cmd/migrate/

      - name: Run CLI version check
        run: ./iso-cli version

  integration:
    name: PostgreSQL integration & tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sgsi
          POSTGRES_PASSWORD: sgsi_ci
          POSTGRES_DB: sgsi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgsi -d sgsi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # A real S3-compatible service, so request signing is checked by an
      # independent implementation. Started with docker run because service
      # containers cannot receive a command or a mounted config file.
      - name: Start SeaweedFS (S3-compatible storage)
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -v "$PWD/deploy/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/ || true)
            if [ "$code" != "000" ]; then
              echo "S3 gateway answering (HTTP $code)"
              sleep 5   # let the volume server register before the first write
              exit 0
            fi
            sleep 1
          done
          docker logs s3
          exit 1

      - name: Run integration tests (migrations, RLS, stores, audit trail, S3 storage)
        env:
          TEST_DATABASE_URL: postgres://sgsi:sgsi_ci@localhost:5432/sgsi?sslmode=disable
          TEST_S3_ENDPOINT: http://localhost:8333
          TEST_S3_ACCESS_KEY: sgsi_s3
          TEST_S3_SECRET_KEY: sgsi_s3_dev
        run: go test -race -count=1 -v ./internal/database/... ./internal/directory/... ./internal/api/... ./internal/storage/...

      # A skipped test here would mean the real services were not exercised.
      - name: Fail if any integration test was skipped
        env:
          TEST_DATABASE_URL: postgres://sgsi:sgsi_ci@localhost:5432/sgsi?sslmode=disable
          TEST_S3_ENDPOINT: http://localhost:8333
          TEST_S3_ACCESS_KEY: sgsi_s3
          TEST_S3_SECRET_KEY: sgsi_s3_dev
        run: |
          if go test -count=1 -v ./internal/database/... ./internal/directory/... ./internal/api/... ./internal/storage/... | grep -E '^\s*--- SKIP'; then
            echo "integration tests were skipped"
            exit 1
          fi

      - name: Show storage logs on failure
        if: failure()
        run: docker logs s3 2>&1 | tail -60

  compose:
    name: Docker Compose environment (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exactly what a developer runs: the compose file, the image build,
      # the migrations inside the container and the development settings.
      - name: Start the whole stack
        run: docker compose --profile app up -d --build --wait --wait-timeout 180

      - name: Sign in, upload evidence and read it back through the API
        run: |
          set -euo pipefail
          api=http://localhost:8080
          curl -sf "$api/readyz"
          curl -sf -c cookies -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"x","tenant_id":"00000000-0000-4000-8000-000000000001"}' \
            "$api/auth/login" > /dev/null
          created=$(curl -sf -b cookies -X POST "$api/api/v1/soa/initialize")
          echo "$created" | grep -q '"created":93'
          echo "evidencia de humo $(date)" > evidence.txt
          id=$(curl -sf -b cookies -F title=Humo -F controls=A.5.1 -F file=@evidence.txt "$api/api/v1/evidence" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["id"])')
          curl -sf -b cookies "$api/api/v1/evidence/$id/download" | cmp - evidence.txt
          curl -sf -b cookies "$api/api/v1/evidence/$id/integrity" | grep -q '"intact":true'
          # Without a session nothing is readable.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api/api/v1/evidence/$id/download")" = 401
          echo "compose smoke test passed"

      - name: Show logs on failure
        if: failure()
        run: docker compose --profile app logs --tail 80

  web:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

  validate-docs:
    name: Validate documentation
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build CLI
        run: go build -o iso-cli ./cmd/iso-cli/

      # This repository ships the policies as templates, so placeholders such
      # as [EMPRESA] are expected here and only reported. Organizations that
      # adopt the templates should add --strict to fail on unfilled fields.
      - name: Validate docs (report placeholders)
        run: ./iso-cli validate-docs --path ./docs/

  compliance-report:
    name: Generate compliance report
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build CLI
        run: go build -o iso-cli ./cmd/iso-cli/

      - name: Export SoA report
        run: ./iso-cli export-soa --input SOA_Matrix.json --output compliance-report.json

      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance-report.json
          retention-days: 30

  lint-json:
    name: Validate JSON files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SOA_Matrix.json
        run: python3 -m json.tool SOA_Matrix.json > /dev/null
